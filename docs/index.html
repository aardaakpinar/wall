<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<!-- Responsive -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Primary SEO -->
		<title>Wall - Modular Bento Grid Portfolio Engine</title>
		<meta name="description" content="Wall is a modular, YAML-driven Bento Grid portfolio engine for building fast, minimal, and customizable static portfolios." />
		<meta name="keywords" content="wall, bento grid, portfolio, yaml, static site generator, developer portfolio, minimal portfolio" />
		<meta name="author" content="aardaakpinar" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#dcd9e6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e0d16" media="(prefers-color-scheme: dark)" />

		<!-- Preconnects for faster CDN/font requests -->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://cdn.boxicons.com" crossorigin />

		<link rel="preload" as="image" href="https://picsum.photos/600" fetchpriority="high" />

		<!-- Canonical -->
		<link rel="canonical" href="https://aardaakpinar.github.io/wall/" />

		<!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Wall - Modular Bento Grid Portfolio Engine" />
		<meta property="og:description" content="Build modern portfolios with YAML-driven Bento Grid system. Fast, minimal, customizable." />

		<meta property="og:site_name" content="Wall" />

		<meta name="twitter:card" content="summary_large_image" />

		<meta name="twitter:description" content="YAML-driven Bento Grid portfolio engine for modern developers." />
		<meta name="twitter:image" content="https://aardaakpinar.github.io/wall/images/example.png" />

		<!-- Icons -->
		<link rel="icon" href="images/logo.svg" />
		<link rel="shortcut icon" href="images/logo.svg" />
	</head>
