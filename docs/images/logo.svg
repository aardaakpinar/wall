<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bentoGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8c62ff"/>
      <stop offset="100%" stop-color="#5522e0"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="120" height="120" rx="28" fill="#17142a"/>
  
  <!-- Bento Brick 1: Hero Large (Top-Left) -->
  <rect x="18" y="18" width="48" height="48" rx="10" fill="url(#bentoGrad)"/>
  
  <!-- Bento Brick 2: Wide Brick (Top-Right) -->
  <rect x="72" y="18" width="30" height="21" rx="7" fill="#a58bff" fill-opacity="0.9"/>
  
  <!-- Bento Brick 3: Medium (Middle-Right) -->
  <rect x="72" y="45" width="30" height="21" rx="7" fill="#6d3df0" fill-opacity="0.4"/>
  
  <!-- Bento Brick 4: Tall/Accent (Bottom-Left) -->
  <rect x="18" y="72" width="21" height="30" rx="7" fill="#6d3df0" fill-opacity="0.4"/>
  
  <!-- Bento Brick 5: Wide Base (Bottom-Right) -->
  <rect x="45" y="72" width="57" height="30" rx="10" fill="url(#bentoGrad)"/>
</svg>
